name: lista_precios_app
description: Aplicación de gestión de inventario y lista de precios - El Torreón
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI y Material Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Escaneo de códigos de barras y QR
  mobile_scanner: ^3.5.5
  
  # Manejo de archivos Excel
  excel: ^4.0.2
  file_picker: ^6.1.1
  
  # Almacenamiento local (base de datos SQLite)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Búsqueda por voz
  speech_to_text: ^6.5.1
  permission_handler: ^11.1.0
  
  # Gestión de estado
  provider: ^6.1.1
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.3.3
  path: ^1.8.3
  
  # Exportación de datos
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # HTTP para búsqueda de productos online
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
